camera:
  mode: opencv
  source_mode: daemon_primary
  index: 0
  width: 640
  height: 480
  daemon:
    enabled: true
    rtsp_url: rtsp://127.0.0.1:8554/unicast
    open_timeout_s: 5.0
    read_timeout_s: 3.0
    healthcheck_interval_s: 5.0
    healthcheck_timeout_s: 2.0
    connect_transport: tcp
capture:
  interval_seconds: 30
  quality: 90
preview:
  fps: 6
storage:
  fallback_path: ./data
led:
  enabled: true
  warmup_seconds: 1
  pre_capture_lead_seconds: 1.0
grove_relay:
  enabled: true
  pin: 26
  active_high: true
grove_relay_2:
  enabled: true
  pin: 24
  active_high: true
display:
  show_countdown: true
  show_storage_info: true
  window_width: 800
  window_height: 450
  center_window: true
  fullscreen: false
grove_button:
  enabled: true
  pin_button1: 5
  pin_button2: 6
  debounce_ms: 250
  start_stop_button: button2
  stop_button: button1
