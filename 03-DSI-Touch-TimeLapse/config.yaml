camera:
  mode: opencv
  index: 0
  width: 640
  height: 480
capture:
  interval_seconds: 15
  quality: 90
preview:
  fps: 6
storage:
  fallback_path: ./data
led:
  backend: grove
  enabled: true
  warmup_seconds: 1
  # Extra lead time the LED stays on BEFORE each snapshot (in seconds),
  # added on top of warmup_seconds. Useful to fully light the scene
  # before the camera fires. Post-capture LED-off delay stays at warmup_seconds.
  pre_capture_lead_seconds: 1.0
  usb_port: auto
display:
  show_countdown: true
  show_storage_info: true
  window_width: 800
  window_height: 450
  center_window: true
  fullscreen: false
grove_button:
  enabled: true
  pin_button1: 5
  pin_button2: 6
  debounce_ms: 250
  start_stop_button: button2
  stop_button: button1
grove_light:
  enabled: true
  pin: 12
  pixel_count: 20
  brightness: 40
  state_palette: classic
  capture_flash: true
  capture_flash_duration_ms: 80
